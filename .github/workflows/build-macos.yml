name: Build macOS standalone
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            python_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install numpy==2.4.6 opencv-python-headless==4.13.0.92 pyinstaller==6.22.0
      - name: Validate native architecture
        run: python -c "import platform; assert platform.machine() == '${{ matrix.arch }}'"
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s tests -p test_tracker.py
      - name: Collect Python license matching the build interpreter
        run: |
          python - <<'PY'
          from pathlib import Path
          import platform, urllib.request
          Path('build').mkdir(exist_ok=True)
          urllib.request.urlretrieve('https://raw.githubusercontent.com/python/cpython/v'+platform.python_version()+'/LICENSE', 'build/Python-LICENSE.txt')
          PY
      - run: bash -n Install-PRTrack.command scripts/install-macos.sh
      - run: python scripts/build_runtime.py
      - run: python scripts/verify_runtime.py
      - run: python scripts/package_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: PR-Track-macOS-${{ matrix.arch }}
          path: dist/*macOS-*
          if-no-files-found: error
