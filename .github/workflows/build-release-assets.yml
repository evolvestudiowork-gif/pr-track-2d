# Build the three standalone ZIPs on native runners and attach them to an
# existing GitHub Release (draft or published). Run from the Actions tab.
name: Build release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.6.0
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: Windows
            python_arch: x64
            machine: AMD64
            package: package.py
          - runner: macos-26
            platform: macOS-arm64
            python_arch: arm64
            machine: arm64
            package: package_macos.py
          - runner: macos-15-intel
            platform: macOS-x86_64
            python_arch: x64
            machine: x86_64
            package: package_macos.py
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}
      - run: python -m pip install -r scripts/requirements-build.txt

      - name: Check native architecture
        run: python -c "import platform; m = platform.machine(); assert m == '${{ matrix.machine }}', m"
      - name: Check tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${{ inputs.tag }}" ]; then
            echo "Tag ${{ inputs.tag }} does not match package.json ($version)"; exit 1
          fi

      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s tests -p "test_*.py"

      - name: Collect Python license for the bundled interpreter
        run: |
          python - <<'PY'
          from pathlib import Path
          import platform, urllib.request
          Path('build').mkdir(exist_ok=True)
          urllib.request.urlretrieve(
              'https://raw.githubusercontent.com/python/cpython/v' + platform.python_version() + '/LICENSE',
              'build/Python-LICENSE.txt')
          PY
      - name: Build engine
        run: python scripts/build_runtime.py
      - name: Verify engine without Python on PATH
        run: python scripts/verify_runtime.py
      - name: Package
        run: python scripts/${{ matrix.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: PR-Track-2D-${{ matrix.platform }}
          path: dist/*-${{ matrix.platform }}-Standalone.zip
          if-no-files-found: error

  attach:
    name: Attach to release ${{ inputs.tag }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          test "$(ls *.zip | wc -l)" -eq 3
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/*.zip dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
